<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTiers - PvP Leaderboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Темно-оранжевый с легким переливанием в черный вниз */
            background: linear-gradient(180deg, #241103 0%, #140a03 40%, #070301 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: rgba(20, 13, 9, 0.6);
            border: 1px solid rgba(224, 106, 32, 0.15);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(224, 106, 32, 0.2);
            padding-bottom: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #ff7b25;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ffffff;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ff7b25;
        }

        /* Меню подразделов для каждого кита */
        .kits-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .kit-tab {
            background: rgba(35, 25, 20, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #999;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .kit-tab:hover {
            border-color: rgba(255, 123, 37, 0.4);
            color: #fff;
        }

        .kit-tab.active {
            background: #ff7b25;
            color: #fff;
            border-color: #ff7b25;
            box-shadow: 0 0 12px rgba(255, 123, 37, 0.4);
        }

        /* Поле поиска игроков */
        .search-container {
            margin-bottom: 25px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(20, 13, 9, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #ff7b25;
            box-shadow: 0 0 10px rgba(255, 123, 37, 0.2);
        }

        .search-input::placeholder {
            color: #666;
        }

        /* Анимация плавного появления таблиц */
        .leaderboard-section {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .leaderboard-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            padding: 12px 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.25s ease;
        }

        tr:hover {
            background-color: rgba(255, 123, 37, 0.05);
            box-shadow: inset 0 0 15px rgba(255, 123, 37, 0.1);
        }

        td {
            padding: 14px 15px;
            vertical-align: middle;
        }

        .rank {
            font-weight: 800;
            font-size: 16px;
            width: 50px;
        }
        
        .rank-1 { color: #ffb834; }
        .rank-2 { color: #b1b1b1; }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: #2a1d15;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ff7b25;
            border: 1px solid rgba(255, 123, 37, 0.2);
            text-transform: uppercase;
        }

        .player-info .name {
            font-weight: 700;
            color: #fff;
            font-size: 15px;
        }

        .player-info .title {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .region-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .region-ru { 
            background: rgba(46, 204, 113, 0.15); 
            color: #2ecc71; 
            border: 1px solid rgba(46, 204, 113, 0.3); 
        }

        .tiers-container {
            display: flex;
            gap: 6px;
        }

        .tier-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 4px;
            background: #221812;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .tier-ht1 { color: #ff4757; border-color: rgba(255, 71, 87, 0.3); }
        .tier-lt1 { color: #ffa502; border-color: rgba(255, 165, 2, 0.3); }
        .tier-ht2 { color: #1e90ff; border-color: rgba(30, 144, 255, 0.3); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">ON<span>Tiers</span></div>
        <div class="nav-links">
            <a href="#">Главная</a>
            <a href="#">Рейтинги</a>
            <!-- Добавлена ваша прямая ссылка на Дискорд OnTiers -->
            <a href="https://discord.gg/MzFdJthgW" target="_blank" rel="noopener noreferrer">Дискорд</a>
        </div>
    </header>

    <div class="kits-nav">
        <div class="kit-tab active" onclick="switchKit('overall')">Overall</div>
        <div class="kit-tab" onclick="switchKit('beast')">Beast</div>
        <div class="kit-tab" onclick="switchKit('vanilla')">Vanilla</div>
        <div class="kit-tab" onclick="switchKit('npot')">NPot</div>
        <div class="kit-tab" onclick="switchKit('dpot')">DPot</div>
    </div>

    <!-- Инпут поиска -->
    <div class="search-container">
        <input type="text" id="playerSearch" class="search-input" placeholder="Поиск игрока по никнейму..." oninput="handleSearch()">
    </div>

    <!-- Раздел: OVERALL -->
    <div id="overall" class="leaderboard-section active">
        <div class="table-responsive">
            <table>
                <thead><tr><th>Ранг</th><th>Игрок</th><th>Регион</th><th>Тиры</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Раздел: BEAST -->
    <div id="beast" class="leaderboard-section">
        <div class="table-responsive">
            <table>
                <thead><tr><th>Ранг</th><th>Игрок (Beast)</th><th>Регион</th><th>Тиры</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="vanilla" class="leaderboard-section"><p style="padding: 20px; color: #666;">Здесь будут лидеры подраздела Vanilla...</p></div>
    <div id="npot" class="leaderboard-section"><p style="padding: 20px; color: #666;">Здесь будут лидеры подраздела NPot...</p></div>
    <div id="dpot" class="leaderboard-section"><p style="padding: 20px; color: #666;">Здесь будут лидеры подраздела DPot...</p></div>
</div>

<script src="sait.js"></script>
</body>
</html>
